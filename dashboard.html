<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberPulse // 流量數據觀測儀表板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --neon-cyan: #00f3ff; --neon-magenta: #ff0055; --bg-dark: #0a0a0f; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-dark); font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .dashboard-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 900px; background: rgba(16, 16, 24, 0.75); border: 1px solid var(--neon-cyan); border-radius: 12px; padding: 30px; z-index: 2; backdrop-filter: blur(10px); box-shadow: 0 0 30px rgba(0, 243, 255, 0.2); }
        h1 { margin-0: 0; font-size: 24px; letter-spacing: 2px; color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0, 243, 255, 0.5); border-bottom: 1px solid rgba(0, 243, 255, 0.3); padding-bottom: 10px; }
        .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 25px 0; }
        .metric-card { background: rgba(255, 255, 255, 0.03); border-left: 3px solid var(--neon-magenta); padding: 15px; border-radius: 4px; }
        .metric-title { font-size: 12px; color: #8a8a93; text-transform: uppercase; }
        .metric-value { font-size: 28px; font-weight: bold; color: #fff; margin-top: 5px; font-family: monospace; }
        .chart-wrapper { position: relative; width: 100%; height: 300px; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { background: transparent; border: 1px solid var(--neon-magenta); color: #fff; padding: 8px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; transition: all 0.3s; }
        button:hover, button.active { background: var(--neon-magenta); box-shadow: 0 0 15px var(--neon-magenta); text-shadow: 0 0 5px #fff; }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="dashboard-container">
        <h1>// CYBERPULSE_TRAFFIC_ENGINE v1.0</h1>
        
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-title">演算法破圈率 (CTR)</div>
                <div class="metric-value" id="ctr-val">14.2%</div>
            </div>
            <div class="metric-card" style="border-left-color: var(--neon-cyan);">
                <div class="metric-title">極限留存時數 (Retention)</div>
                <div class="metric-value" id="ret-val">78.5%</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">系統綜合權重增加</div>
                <div class="metric-value" style="color: var(--neon-magenta);">+320%</div>
            </div>
        </div>

        <div class="chart-wrapper">
            <canvas id="trafficChart"></canvas>
        </div>

        <div class="btn-group">
            <button class="active" onclick="updateData('optimize')">演算法優化策略啟動</button>
            <button onclick="updateData('baseline')">原始流量基準線</button>
        </div>
    </div>

    <script>
        // 1. Canvas 賽博朋克背景粒子動力學矩陣
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        class Particle {
            constructor() { this.reset(); }
            reset() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.vx = (Math.random() - 0.5) * 1.5; this.vy = (Math.random() - 0.5) * 1.5; this.size = Math.random() * 2; }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
            }
        }
        for(let i=0; i<80; i++) particles.push(new Particle());
        function animate() {
            ctx.fillStyle = 'rgba(10, 10, 15, 0.2)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00f3ff';
            particles.forEach(p => {
                p.update(); ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        animate();

        // 2. Chart.js 動態數據圖表配置
        const chartCtx = document.getElementById('trafficChart').getContext('2d');
        const dataset = {
            optimize: { label: '優化後演算法破圈增長', data: [1200, 2500, 4800, 8900, 15000, 32000], ctr: '14.2%', ret: '78.5%' },
            baseline: { label: '原始自然流量平穩線', data: [1000, 1100, 1050, 1200, 1150, 1300], ctr: '4.1%', ret: '31.2%' }
        };

        const trafficChart = new Chart(chartCtx, {
            type: 'line',
            data: {
                labels: ['Day 1', 'Day 2', 'Day 3', 'Day 4', 'Day 5', 'Day 6'],
                datasets: [{
                    label: dataset.optimize.label,
                    data: dataset.optimize.data,
                    borderColor: '#00f3ff',
                    backgroundColor: 'rgba(0, 243, 255, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#fff' } } },
                scales: {
                    x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8a8a93' } },
                    y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8a8a93' } }
                }
            }
        });

        function updateData(type) {
            document.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            trafficChart.data.datasets[0].label = dataset[type].label;
            trafficChart.data.datasets[0].data = dataset[type].data;
            trafficChart.data.datasets[0].borderColor = type === 'optimize' ? '#00f3ff' : '#ff0055';
            trafficChart.data.datasets[0].backgroundColor = type === 'optimize' ? 'rgba(0, 243, 255, 0.1)' : 'rgba(ff, 0, 85, 0.1)';
            trafficChart.update();
            document.getElementById('ctr-val').innerText = dataset[type].ctr;
            document.getElementById('ret-val').innerText = dataset[type].ret;
        }
    </script>
</body>
</html>
